a within ODU's Department of Art. Rather than a separate metals/jewel"}, {"name": "Oral Roberts University", "status": "merged", "state": "OK", "lat": 35.6, "lng": -97.5, "prec": "state", "w": 2, "summary": "The art program continued and expanded rather than closing. ORU added a BFA in Art around 2012 and the offering now sits in the College of Arts & Cultural Studies with Studio Art, Graphic Design, and Game Design concentrations. The discrete"}, {"name": "Oregon School of Arts & Crafts", "status": "closed", "state": "OR", "lat": 45.52, "lng": -122.68, "prec": "city", "w": 1, "summary": "The institution archived as \"Oregon School of Arts & Crafts\" (the name used 1978\u20131996) was renamed \"Oregon College of Art and Craft\" (OCAC) in 1996. OCAC began granting the BFA in 1994 and added an MFA in Craft by fall 2013. Facing severe f"}, {"name": "Parsons School of Design", "status": "merged", "state": "NY", "lat": 40.73, "lng": -73.99, "prec": "city", "w": 4, "summary": "The dedicated metals/jewelry degree program at Parsons did not survive to the present. Mary Ann Scherr chaired the Crafts Department (renamed Department of Clay, Metal, Glass and Textiles c.1980) from roughly 1979/1980 to 1989; William Harp"}, {"name": "Pasadena City College", "status": "active", "state": null, "lat": 34.15, "lng": -118.14, "prec": "city", "w": 1, "summary": "Continuation. The metals/jewelry program has remained active and is currently offered. Course schedule data shows active sections through the 2024-2025 academic year (term codes 202470, 202530, 202570). No evidence of closure, merger, or re"}, {"name": "Pennsylvania State University", "status": "closed", "state": "PA", "lat": 40.9, "lng": -77.8, "prec": "state", "w": 1, "summary": "The degree-granting Metal Arts area in the School of Visual Arts at University Park was effectively discontinued. Leslie Leupp, who headed Metals Arts from 1988, retired in 2006 (he died Feb 2011). The program was not continued/replaced as "}, {"name": "Pittsburg State University", "status": "active", "state": "KS", "lat": 37.41, "lng": -94.7, "prec": "city", "w": 6, "summary": "Continuation with a leadership/curriculum change. Marjorie Schick \u2014 the long-serving jewelry/metalsmithing professor named in the archived record (\"1967 to present\") \u2014 taught at Pittsburg State for 50 years and died December 17, 2017 (compl"}, {"name": "Portland School of Art", "status": "merged", "state": "ME", "lat": 43.66, "lng": -70.26, "prec": "city", "w": 3, "summary": "The institution (not the program) was renamed, not closed. \"Portland School of Art\" (Portland, Maine; founded 1882 as Portland Society of Art, became Portland School of Art in 1972) was renamed Maine College of Art (MECA) in 1992, then Main"}, {"name": "Purdue University", "status": "merged", "state": "TX", "lat": 31.5, "lng": -99.3, "prec": "state", "w": 6, "summary": "The metals program continued through the archival period and remains active, but the surrounding administrative structure was renamed/reorganized. Robin Kraft (in the archived record \"1994 to present\") taught Jewelry and Metalsmithing at Pu"}, {"name": "Quincy College", "status": "unknown", "state": "MA", "lat": 42.3, "lng": -71.8, "prec": "state", "w": 0, "summary": "No evidence found that Quincy College (Quincy, MA) ever operated a dedicated metals/jewelry program. The current institution offers only a general Fine Arts: Visual Arts AA with no metals component, and its workforce/continuing-education ca"}, {"name": "Revere Academy of Jewelry Arts", "status": "closed", "state": "CA", "lat": 37.2, "lng": -119.7, "prec": "state", "w": 1, "summary": "The Revere Academy of Jewelry Arts, a private (non-degree) jewelry/metals trade school founded by master goldsmith Alan Revere in San Francisco in 1979, closed permanently on December 15, 2017 with the graduation of its 34th Jewelry Technic"}, {"name": "Rhode Island College", "status": "active", "state": "RI", "lat": 41.7, "lng": -71.5, "pr const svg = d3.select("#map"), tip = d3.select("#tip");
let W = innerWidth, H = innerHeight;
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0)/4294967295}
const COLOR = {active:"#ffd27a", merged:"#e08b4a", closed:"#8a4a4a", unknown:"#6f6f80"};
const GLOW  = {active:"#ffb24a", merged:"#c0682a", closed:"#6a2a2a", unknown:"#44444f"};

d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json").then(us=>{
  draw(us);
  addEventListener("resize", ()=>{W=innerWidth;H=innerHeight;svg.selectAll("*").remove();draw(us);});
});

function draw(us){
  svg.attr("width",W).attr("height",H);
  const states = topojson.feature(us, us.objects.states);
  const proj = d3.geoAlbersUsa().fitExtent([[40,90],[W-40,H-40]], states);
  const path = d3.geoPath(proj);
  const maxCount = Math.max(...Object.values(DATA.stateCounts));

  // heat: tint each state by program density
  const heat = d3.scaleSequential(t=>d3.interpolateRgb("#101018","#3a241a")(t)).domain([0,maxCount]);
  const byId = {}; // FIPS not needed; tint by centroid->state match is hard, so flat dark + per-state glow blobs
  svg.append("g").selectAll("path").data(states.features).join("path")
     .attr("d",path).attr("fill","#0e0e16").attr("stroke","#23232e").attr("stroke-width",.7);

  // city-accurate dots barely jitter (just to unstack); state-only dots spread to fill the state
  const P = p => { const j = p.prec==="city" ? .28 : 1.1;
    return proj([p.lng + (hash(p.name)-.5)*j*1.4, p.lat + (hash(p.name+"y")-.5)*j]); };

  // lineage-migration arcs
  const arcG = svg.append("g").attr("opacity",.5);
  const maxF = Math.max(1,...DATA.flows.map(f=>f.n));
  arcG.selectAll("path").data(DATA.flows).join("path").attr("d",f=>{
      const a=proj([f.a[1],f.a[0]]), b=proj([f.b[1],f.b[0]]); if(!a||!b)return null;
      const dx=b[0]-a[0],dy=b[1]-a[1],dr=Math.hypot(dx,dy)*1.3;
      return `M${a[0]},${a[1]}A${dr},${dr} 0 0,1 ${b[0]},${b[1]}`;
    }).attr("fill","none").attr("stroke","#ff9a3c")
      .attr("stroke-width",f=>.4+f.n/maxF*1.6).attr("stroke-opacity",f=>.12+f.n/maxF*.35)
      .attr("stroke-linecap","round");
  d3.select("#arcs").on("change",function(){arcG.attr("display",this.checked?null:"none")});

  // program glow dots
  const r = d3.scaleSqrt().domain([1, Math.max(2,d3.max(DATA.points,p=>p.w))]).range([3.5,16]);
  const g = svg.append("g");
  g.selectAll("circle").data(DATA.points.filter(p=>proj([p.lng,p.lat]))).join("circle")
    .attr("cx",p=>(P(p)||[-99,-99])[0]).attr("cy",p=>(P(p)||[-99,-99])[1])
    .attr("r",p=>r(p.w)).attr("fill",p=>COLOR[p.status]||COLOR.unknown)
    .attr("fill-opacity",.85).style("filter",p=>`drop-shadow(0 0 ${r(p.w)*.9}px ${GLOW[p.status]||GLOW.unknown})`)
    .attr("stroke","rgba(255,255,255,.25)").attr("stroke-width",.5)
    .on("mousemove",(ev,p)=>{tip.style("opacity",1).style("left",(ev.clientX+14)+"px").style("top",(ev.clientY+12)+"px")
        .html(`<b>${p.name}</b><br>${p.status} · ${p.state} · ${p.w} connections<br><span style="color:#9a968a">${p.summary||""}</span>`);})
    .on("mouseleave",()=>tip.style("opacity",0));
}
